<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SPINNER</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #1a1a1a;
    --text: #ffffff;
    --text-muted: #999;
    --border: #333;
    --accent: #ff4444;
  }

  [data-theme="light"] {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --text: #111111;
    --text-muted: #666;
    --border: #ddd;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    transition: background 0.3s, color 0.3s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ── BACKGROUND IMAGE ── */
  #bgImage {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: blur(12px) brightness(0.4);
    transform: scale(1.1);
    z-index: 0;
    display: none;
    transition: filter 0.3s;
  }

  [data-theme="light"] #bgImage {
    filter: blur(12px) brightness(0.7);
  }

  #bgImage.active { display: block; }

  /* ── TITLE ── */
  #spinnerTitle {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(20px, 5vw, 42px);
    font-weight: 900;
    text-align: center;
    z-index: 10;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    max-width: 80vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #spinnerTitle.visible { opacity: 1; }

  /* ── MAIN SPINNER VIEW ── */
  #spinnerView {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    width: 100vw;
    position: relative;
    z-index: 1;
  }

  #canvasWrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#wheel {
    cursor: pointer;
    filter: drop-shadow(0 0 30px rgba(0,0,0,0.3));
    transition: filter 0.3s;
  }

  canvas#wheel:hover {
    filter: drop-shadow(0 0 40px rgba(0,0,0,0.4));
  }

  /* Pointer / indicator */
  #pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 36px solid var(--accent);
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    z-index: 10;
    transition: border-top-color 0.3s;
  }

  /* Center button */
  #centerBtn {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--bg);
    border: 4px solid var(--accent);
    color: var(--text);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.3s, border-color 0.3s;
    text-transform: uppercase;
  }

  #centerBtn:hover { transform: scale(1.08); }
  #centerBtn:active { transform: scale(0.95); }
  #centerBtn.spinning { pointer-events: none; opacity: 0.6; }

  /* ── TOP BAR BUTTONS ── */
  #topBar {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 100;
  }

  .top-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .top-btn:hover { background: var(--border); }

  /* ── ADMIN PANEL ── */
  #adminPanel {
    position: fixed;
    top: 0;
    right: -420px;
    width: 400px;
    max-width: 92vw;
    height: 100dvh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 200;
    transition: right 0.3s ease;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  #adminPanel.open { right: 0; }

  #adminOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 199;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  #adminOverlay.open { opacity: 1; pointer-events: all; }

  .admin-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .admin-header h2 { font-size: 18px; font-weight: 700; }

  .admin-close {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
  }

  .admin-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .admin-section h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  /* Title input */
  #titleInput {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    outline: none;
  }

  #titleInput:focus { border-color: var(--accent); }

  /* Options list */
  .option-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .option-item input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }

  .option-item input:focus { border-color: var(--accent); }

  .option-remove {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: none;
    border: 1px solid var(--border);
    color: #e55;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .option-remove:hover { background: rgba(238,85,85,0.1); }

  .btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn:hover { opacity: 0.85; }

  .btn-add {
    background: var(--accent);
    color: white;
    width: 100%;
    margin-top: 4px;
  }

  /* Rigged controls */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .toggle-label { font-size: 15px; font-weight: 500; }

  .toggle {
    width: 48px;
    height: 28px;
    border-radius: 14px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
  }

  .toggle.on { background: var(--accent); }

  .toggle::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: white;
    transition: left 0.2s;
  }

  .toggle.on::after { left: 23px; }

  #riggedSelect {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    display: none;
  }

  #riggedSelect.visible { display: block; }

  /* Color theme */
  .color-inputs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .color-input-wrap {
    position: relative;
    width: 44px;
    height: 44px;
  }

  .color-input-wrap input[type="color"] {
    width: 44px;
    height: 44px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    padding: 2px;
    background: var(--bg);
  }

  .color-remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #e55;
    color: white;
    border: none;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .btn-add-color {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 2px dashed var(--border);
    background: none;
    color: var(--text-muted);
    font-size: 22px;
    cursor: pointer;
  }

  /* Background image upload */
  .bg-upload-area {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .bg-upload-btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 2px dashed var(--border);
    background: none;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.2s;
  }

  .bg-upload-btn:hover { border-color: var(--accent); }

  .bg-upload-btn.has-image {
    border-style: solid;
    border-color: var(--accent);
    color: var(--text);
  }

  .bg-clear-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: none;
    border: 1px solid var(--border);
    color: #e55;
    font-size: 16px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .bg-clear-btn.visible { display: flex; }

  .bg-slider-row {
    margin-top: 12px;
    display: none;
  }

  .bg-slider-row.visible { display: block; }

  .bg-slider-row label {
    font-size: 13px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 6px;
  }

  .bg-slider-row input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  /* Theme toggle */
  .theme-row {
    display: flex;
    gap: 8px;
  }

  .theme-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: none;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .theme-btn.active { border-color: var(--accent); }

  /* Fullscreen btn */
  .btn-fullscreen {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    width: 100%;
    margin-top: 8px;
  }

  /* Sound toggle */
  .sound-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ── SAVE / LOAD ── */
  .save-row {
    display: flex;
    gap: 8px;
  }

  .save-row .btn {
    flex: 1;
  }

  .btn-save {
    background: var(--accent);
    color: white;
  }

  .btn-load {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .saved-list {
    margin-top: 12px;
  }

  .saved-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .saved-item:hover { background: var(--bg); }

  .saved-item-info {
    flex: 1;
    overflow: hidden;
  }

  .saved-item-title {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .saved-item-meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .saved-item-delete {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: none;
    border: none;
    color: #e55;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .saved-item-delete:hover { background: rgba(238,85,85,0.1); }

  .no-saved {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    padding: 12px;
  }

  /* ── RESULT OVERLAY ── */
  #resultOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  #resultOverlay.show {
    display: flex;
    opacity: 1;
  }

  #resultText {
    font-size: clamp(36px, 10vw, 80px);
    font-weight: 900;
    text-align: center;
    padding: 0 20px;
    animation: resultPop 0.5s ease;
    text-shadow: 0 0 40px rgba(255,255,255,0.3);
  }

  #resultDismiss {
    padding: 14px 40px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }

  @keyframes resultPop {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Confetti canvas */
  #confetti {
    position: fixed;
    inset: 0;
    z-index: 301;
    pointer-events: none;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    #centerBtn { width: 64px; height: 64px; font-size: 12px; }
    #pointer { border-left-width: 14px; border-right-width: 14px; border-top-width: 28px; top: -14px; }
  }

  @media (max-height: 500px) {
    #spinnerView { padding: 10px; }
    #spinnerTitle { top: 8px; font-size: clamp(16px, 4vw, 28px); }
  }
</style>
</head>
<body>

<!-- Background Image -->
<div id="bgImage"></div>

<!-- Title -->
<div id="spinnerTitle"></div>

<!-- Top bar buttons -->
<div id="topBar">
  <button class="top-btn" id="savedBtn" aria-label="Saved Spinners" title="Saved Spinners">&#9776;</button>
  <button class="top-btn" id="adminToggle" aria-label="Settings" title="Settings">&#9881;</button>
</div>

<!-- Admin Overlay -->
<div id="adminOverlay"></div>

<!-- Admin Panel -->
<div id="adminPanel">
  <div class="admin-header">
    <h2>Settings</h2>
    <button class="admin-close" id="adminClose">&times;</button>
  </div>

  <!-- Title -->
  <div class="admin-section">
    <h3>Title</h3>
    <input type="text" id="titleInput" placeholder="Spinner title (optional)">
  </div>

  <!-- Options -->
  <div class="admin-section">
    <h3>Options</h3>
    <div id="optionsList"></div>
    <button class="btn btn-add" id="addOption">+ Add Option</button>
  </div>

  <!-- Rigged Mode -->
  <div class="admin-section">
    <h3>Spin Mode</h3>
    <div class="toggle-row">
      <span class="toggle-label">Rigged</span>
      <button class="toggle" id="riggedToggle" aria-label="Toggle rigged mode"></button>
    </div>
    <select id="riggedSelect"></select>
  </div>

  <!-- Colors -->
  <div class="admin-section">
    <h3>Wheel Colors</h3>
    <div class="color-inputs" id="colorInputs"></div>
  </div>

  <!-- Background Image -->
  <div class="admin-section">
    <h3>Background Image</h3>
    <div class="bg-upload-area">
      <button class="bg-upload-btn" id="bgUploadBtn">Upload Image</button>
      <button class="bg-clear-btn" id="bgClearBtn">&times;</button>
    </div>
    <input type="file" id="bgFileInput" accept="image/*" style="display:none">
    <div class="bg-slider-row" id="bgBlurRow">
      <label>Blur: <span id="bgBlurVal">12</span>px</label>
      <input type="range" id="bgBlurSlider" min="0" max="30" value="12">
    </div>
    <div class="bg-slider-row" id="bgFadeRow">
      <label>Fade: <span id="bgFadeVal">60</span>%</label>
      <input type="range" id="bgFadeSlider" min="0" max="90" value="60">
    </div>
  </div>

  <!-- Theme -->
  <div class="admin-section">
    <h3>Theme</h3>
    <div class="theme-row">
      <button class="theme-btn" data-theme="dark">Dark</button>
      <button class="theme-btn" data-theme="light">Light</button>
    </div>
    <button class="btn btn-fullscreen" id="fullscreenBtn">&#x26F6; Fullscreen</button>
  </div>

  <!-- Sound -->
  <div class="admin-section">
    <div class="sound-row">
      <span class="toggle-label">Sound Effects</span>
      <button class="toggle on" id="soundToggle" aria-label="Toggle sound"></button>
    </div>
  </div>

  <!-- Save -->
  <div class="admin-section">
    <h3>Save Spinner</h3>
    <div class="save-row">
      <button class="btn btn-save" id="saveBtn">Save Current</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  </div>
</div>

<!-- Spinner View -->
<div id="spinnerView">
  <div id="canvasWrap">
    <div id="pointer"></div>
    <canvas id="wheel"></canvas>
    <button id="centerBtn">SPIN</button>
  </div>
</div>

<!-- Result Overlay -->
<div id="resultOverlay">
  <div id="resultText"></div>
  <button id="resultDismiss">TAP TO CLOSE</button>
</div>

<!-- Confetti -->
<canvas id="confetti"></canvas>

<script>
// ── STATE ──
const state = {
  title: '',
  options: ['Option 1', 'Option 2', 'Option 3', 'Option 4'],
  colors: ['#FF4444', '#FFB800', '#00C853', '#2979FF'],
  rigged: false,
  riggedIndex: 0,
  theme: 'dark',
  sound: true,
  spinning: false,
  rotation: 0,
  bgImage: null,
  bgBlur: 12,
  bgFade: 60,
};

// ── AUDIO (Web Audio API) ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTick() {
  if (!state.sound) return;
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.value = 800 + Math.random() * 400;
  gain.gain.value = 0.08;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playCelebration() {
  if (!state.sound) return;
  ensureAudio();
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.12;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }, i * 100);
  });
}

// ── COLORS ──
function generateWheelColors(baseColors, count) {
  if (baseColors.length === 0) baseColors = ['#FF4444'];
  const result = [];
  for (let i = 0; i < count; i++) {
    if (baseColors.length >= 2) {
      result.push(baseColors[i % baseColors.length]);
    } else {
      const hex = baseColors[0];
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      const factor = 0.5 + (i % 4) * 0.2;
      const clamp = v => Math.min(255, Math.max(0, Math.round(v * factor)));
      result.push(`rgb(${clamp(r)}, ${clamp(g)}, ${clamp(b)})`);
    }
  }
  return result;
}

function getContrastColor(bgColor) {
  let r, g, b;
  if (bgColor.startsWith('#')) {
    r = parseInt(bgColor.slice(1,3), 16);
    g = parseInt(bgColor.slice(3,5), 16);
    b = parseInt(bgColor.slice(5,7), 16);
  } else {
    const match = bgColor.match(/\d+/g);
    [r, g, b] = match.map(Number);
  }
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.5 ? '#000000' : '#FFFFFF';
}

// ── CANVAS ──
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');

function getWheelSize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const titleOffset = state.title ? 60 : 0;
  const size = Math.min(vw, vh - titleOffset) * 0.78;
  return Math.min(size, 600);
}

function drawWheel() {
  const size = getWheelSize();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cx = size / 2;
  const cy = size / 2;
  const radius = size / 2 - 4;
  const opts = state.options;
  const count = opts.length;

  if (count === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#333';
    ctx.fill();
    ctx.fillStyle = '#666';
    ctx.font = '18px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Add options in settings', cx, cy);
    return;
  }

  const sliceAngle = (Math.PI * 2) / count;
  const colors = generateWheelColors(state.colors, count);

  for (let i = 0; i < count; i++) {
    const startAngle = state.rotation + i * sliceAngle;
    const endAngle = startAngle + sliceAngle;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();

    const textAngle = startAngle + sliceAngle / 2;
    const textR = radius * 0.65;
    ctx.save();
    ctx.translate(cx + Math.cos(textAngle) * textR, cy + Math.sin(textAngle) * textR);
    ctx.rotate(textAngle);

    const maxTextLen = radius * 0.45;
    let fontSize = Math.min(18, (sliceAngle * radius * 0.4));
    fontSize = Math.max(10, Math.min(fontSize, 22));
    ctx.font = `700 ${fontSize}px -apple-system, sans-serif`;
    ctx.fillStyle = getContrastColor(colors[i]);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let text = opts[i];
    if (ctx.measureText(text).width > maxTextLen) {
      while (ctx.measureText(text + '\u2026').width > maxTextLen && text.length > 1) {
        text = text.slice(0, -1);
      }
      text += '\u2026';
    }
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = state.theme === 'dark' ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 4;
  ctx.stroke();
}

// ── SPIN LOGIC ──
function getWinningIndex() {
  if (state.rigged) return state.riggedIndex;
  return Math.floor(Math.random() * state.options.length);
}

function spin() {
  if (state.spinning || state.options.length < 2) return;
  state.spinning = true;
  ensureAudio();
  document.getElementById('centerBtn').classList.add('spinning');

  const winIndex = getWinningIndex();
  const count = state.options.length;
  const sliceAngle = (Math.PI * 2) / count;

  const targetSliceCenter = -Math.PI / 2 - winIndex * sliceAngle - sliceAngle / 2;
  const jitter = (Math.random() - 0.5) * sliceAngle * 0.6;
  const fullSpins = 5 + Math.floor(Math.random() * 5);
  const targetRotation = targetSliceCenter + jitter - fullSpins * Math.PI * 2;

  const startRotation = state.rotation;
  const totalDelta = targetRotation - startRotation;
  const duration = 4000 + Math.random() * 2000;
  const startTime = performance.now();

  let lastTickAngle = startRotation;

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    state.rotation = startRotation + totalDelta * eased;

    const currentAngle = ((state.rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const lastAngle = ((lastTickAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const crossedSlice = Math.floor(currentAngle / sliceAngle) !== Math.floor(lastAngle / sliceAngle);
    if (crossedSlice && t < 0.95) playTick();
    lastTickAngle = state.rotation;

    drawWheel();

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      state.rotation = ((state.rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      state.spinning = false;
      document.getElementById('centerBtn').classList.remove('spinning');
      showResult(state.options[winIndex]);
    }
  }

  requestAnimationFrame(animate);
}

// ── RESULT OVERLAY ──
function showResult(text) {
  playCelebration();
  const overlay = document.getElementById('resultOverlay');
  const resultText = document.getElementById('resultText');
  resultText.textContent = text;
  resultText.style.color = state.colors[0] || '#FF4444';
  overlay.classList.add('show');
  launchConfetti();
}

function hideResult() {
  document.getElementById('resultOverlay').classList.remove('show');
}

// ── CONFETTI ──
function launchConfetti() {
  const c = document.getElementById('confetti');
  const cctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = window.innerWidth * dpr;
  c.height = window.innerHeight * dpr;
  c.style.width = window.innerWidth + 'px';
  c.style.height = window.innerHeight + 'px';
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const w = window.innerWidth;
  const h = window.innerHeight;
  const colors = state.colors.length ? state.colors : ['#FF4444', '#FFB800', '#00C853', '#2979FF'];
  const particles = [];

  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h * -0.5,
      vx: (Math.random() - 0.5) * 6,
      vy: Math.random() * 4 + 2,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
      life: 1,
    });
  }

  let frame = 0;
  function animConfetti() {
    cctx.clearRect(0, 0, w, h);
    let alive = false;

    for (const p of particles) {
      if (p.life <= 0) continue;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1;
      p.rotation += p.rotSpeed;
      p.life -= 0.005;

      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rotation);
      cctx.globalAlpha = p.life;
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      cctx.restore();
    }

    frame++;
    if (alive && frame < 300) requestAnimationFrame(animConfetti);
    else cctx.clearRect(0, 0, w, h);
  }

  requestAnimationFrame(animConfetti);
}

// ── BACKGROUND IMAGE ──
function updateBgImage() {
  const el = document.getElementById('bgImage');
  const uploadBtn = document.getElementById('bgUploadBtn');
  const clearBtn = document.getElementById('bgClearBtn');
  const blurRow = document.getElementById('bgBlurRow');
  const fadeRow = document.getElementById('bgFadeRow');

  if (state.bgImage) {
    el.style.backgroundImage = `url(${state.bgImage})`;
    el.classList.add('active');
    uploadBtn.textContent = 'Change Image';
    uploadBtn.classList.add('has-image');
    clearBtn.classList.add('visible');
    blurRow.classList.add('visible');
    fadeRow.classList.add('visible');
  } else {
    el.style.backgroundImage = '';
    el.classList.remove('active');
    uploadBtn.textContent = 'Upload Image';
    uploadBtn.classList.remove('has-image');
    clearBtn.classList.remove('visible');
    blurRow.classList.remove('visible');
    fadeRow.classList.remove('visible');
  }

  updateBgFilters();
}

function updateBgFilters() {
  const el = document.getElementById('bgImage');
  if (!state.bgImage) return;
  const brightness = state.theme === 'light'
    ? (100 - state.bgFade) / 100
    : (100 - state.bgFade) / 100;
  el.style.filter = `blur(${state.bgBlur}px) brightness(${brightness})`;
}

function handleBgUpload(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    state.bgImage = e.target.result;
    updateBgImage();
    saveState();
  };
  reader.readAsDataURL(file);
}

// ── TITLE ──
function updateTitle() {
  const el = document.getElementById('spinnerTitle');
  el.textContent = state.title;
  el.classList.toggle('visible', !!state.title);
  el.style.color = state.colors[0] || '#FF4444';
}

// ── ADMIN PANEL ──
function renderOptions() {
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  state.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option-item';
    div.innerHTML = `
      <input type="text" value="${opt.replace(/"/g, '&quot;')}" data-index="${i}" placeholder="Option ${i + 1}">
      <button class="option-remove" data-index="${i}">&times;</button>
    `;
    list.appendChild(div);
  });
  renderRiggedSelect();
  drawWheel();
}

function renderRiggedSelect() {
  const sel = document.getElementById('riggedSelect');
  sel.innerHTML = '';
  state.options.forEach((opt, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = opt || `Option ${i + 1}`;
    sel.appendChild(o);
  });
  sel.value = state.riggedIndex;
}

function renderColors() {
  const wrap = document.getElementById('colorInputs');
  wrap.innerHTML = '';
  state.colors.forEach((color, i) => {
    const div = document.createElement('div');
    div.className = 'color-input-wrap';
    div.innerHTML = `
      <input type="color" value="${color}" data-index="${i}">
      ${state.colors.length > 1 ? `<button class="color-remove" data-index="${i}">&times;</button>` : ''}
    `;
    wrap.appendChild(div);
  });
  if (state.colors.length < 5) {
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add-color';
    addBtn.textContent = '+';
    addBtn.addEventListener('click', () => {
      const hues = [0, 45, 120, 210, 280];
      const hue = hues[state.colors.length] || Math.random() * 360;
      state.colors.push(hslToHex(hue, 80, 55));
      renderColors();
      drawWheel();
      updateTitle();
      saveState();
    });
    wrap.appendChild(addBtn);
  }
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); };
  return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
}

// ── SAVED SPINNERS ──
function getSavedSpinners() {
  try {
    return JSON.parse(localStorage.getItem('spinner-saved') || '[]');
  } catch { return []; }
}

function setSavedSpinners(list) {
  localStorage.setItem('spinner-saved', JSON.stringify(list));
}

function saveCurrentSpinner() {
  const name = state.title || `Spinner ${new Date().toLocaleDateString()}`;
  const saved = getSavedSpinners();
  saved.unshift({
    id: Date.now().toString(),
    name,
    date: new Date().toISOString(),
    data: {
      title: state.title,
      options: [...state.options],
      colors: [...state.colors],
      rigged: state.rigged,
      riggedIndex: state.riggedIndex,
      theme: state.theme,
      sound: state.sound,
      bgImage: state.bgImage,
      bgBlur: state.bgBlur,
      bgFade: state.bgFade,
    },
  });
  setSavedSpinners(saved);
  renderSavedList();
}

function loadSpinner(data) {
  state.title = data.title || '';
  state.options = data.options || [];
  state.colors = data.colors || ['#FF4444'];
  state.rigged = data.rigged || false;
  state.riggedIndex = data.riggedIndex || 0;
  state.theme = data.theme || 'dark';
  state.sound = data.sound !== false;
  state.bgImage = data.bgImage || null;
  state.bgBlur = data.bgBlur != null ? data.bgBlur : 12;
  state.bgFade = data.bgFade != null ? data.bgFade : 60;
  state.rotation = 0;

  applyFullState();
  saveState();
}

function deleteSpinner(id) {
  const saved = getSavedSpinners().filter(s => s.id !== id);
  setSavedSpinners(saved);
  renderSavedList();
}

function renderSavedList() {
  const container = document.getElementById('savedList');
  const saved = getSavedSpinners();

  if (saved.length === 0) {
    container.innerHTML = '<div class="no-saved">No saved spinners yet</div>';
    return;
  }

  container.innerHTML = '';
  saved.forEach(s => {
    const div = document.createElement('div');
    div.className = 'saved-item';
    const date = new Date(s.date).toLocaleDateString();
    const optCount = s.data.options ? s.data.options.length : 0;
    div.innerHTML = `
      <div class="saved-item-info">
        <div class="saved-item-title">${s.name.replace(/</g, '&lt;')}</div>
        <div class="saved-item-meta">${optCount} options &middot; ${date}</div>
      </div>
      <button class="saved-item-delete" data-id="${s.id}">&times;</button>
    `;
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('saved-item-delete')) {
        e.stopPropagation();
        deleteSpinner(e.target.dataset.id);
        return;
      }
      loadSpinner(s.data);
      closeAdmin();
    });
    container.appendChild(div);
  });
}

// ── EVENT LISTENERS ──
// Admin toggle
document.getElementById('adminToggle').addEventListener('click', () => {
  document.getElementById('adminPanel').classList.add('open');
  document.getElementById('adminOverlay').classList.add('open');
});

// Saved button (also opens admin, scrolls to saved)
document.getElementById('savedBtn').addEventListener('click', () => {
  document.getElementById('adminPanel').classList.add('open');
  document.getElementById('adminOverlay').classList.add('open');
  setTimeout(() => {
    document.getElementById('savedList').scrollIntoView({ behavior: 'smooth' });
  }, 100);
});

function closeAdmin() {
  document.getElementById('adminPanel').classList.remove('open');
  document.getElementById('adminOverlay').classList.remove('open');
}

document.getElementById('adminClose').addEventListener('click', closeAdmin);
document.getElementById('adminOverlay').addEventListener('click', closeAdmin);

// Title
document.getElementById('titleInput').addEventListener('input', (e) => {
  state.title = e.target.value;
  updateTitle();
  saveState();
});

// Options
document.getElementById('addOption').addEventListener('click', () => {
  state.options.push('');
  renderOptions();
  saveState();
  const inputs = document.querySelectorAll('#optionsList input[type="text"]');
  if (inputs.length) inputs[inputs.length - 1].focus();
});

document.getElementById('optionsList').addEventListener('input', (e) => {
  if (e.target.type === 'text') {
    state.options[parseInt(e.target.dataset.index)] = e.target.value;
    renderRiggedSelect();
    drawWheel();
    saveState();
  }
});

document.getElementById('optionsList').addEventListener('click', (e) => {
  if (e.target.classList.contains('option-remove')) {
    const idx = parseInt(e.target.dataset.index);
    state.options.splice(idx, 1);
    if (state.riggedIndex >= state.options.length) state.riggedIndex = 0;
    renderOptions();
    saveState();
  }
});

// Rigged
document.getElementById('riggedToggle').addEventListener('click', (e) => {
  state.rigged = !state.rigged;
  e.currentTarget.classList.toggle('on', state.rigged);
  document.getElementById('riggedSelect').classList.toggle('visible', state.rigged);
  saveState();
});

document.getElementById('riggedSelect').addEventListener('change', (e) => {
  state.riggedIndex = parseInt(e.target.value);
  saveState();
});

// Colors
document.getElementById('colorInputs').addEventListener('input', (e) => {
  if (e.target.type === 'color') {
    state.colors[parseInt(e.target.dataset.index)] = e.target.value;
    updateAccentColor();
    updateTitle();
    drawWheel();
    saveState();
  }
});

document.getElementById('colorInputs').addEventListener('click', (e) => {
  if (e.target.classList.contains('color-remove')) {
    state.colors.splice(parseInt(e.target.dataset.index), 1);
    updateAccentColor();
    updateTitle();
    renderColors();
    drawWheel();
    saveState();
  }
});

// Background image
document.getElementById('bgUploadBtn').addEventListener('click', () => {
  document.getElementById('bgFileInput').click();
});

document.getElementById('bgFileInput').addEventListener('change', (e) => {
  if (e.target.files[0]) handleBgUpload(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('bgClearBtn').addEventListener('click', () => {
  state.bgImage = null;
  updateBgImage();
  saveState();
});

document.getElementById('bgBlurSlider').addEventListener('input', (e) => {
  state.bgBlur = parseInt(e.target.value);
  document.getElementById('bgBlurVal').textContent = state.bgBlur;
  updateBgFilters();
  saveState();
});

document.getElementById('bgFadeSlider').addEventListener('input', (e) => {
  state.bgFade = parseInt(e.target.value);
  document.getElementById('bgFadeVal').textContent = state.bgFade;
  updateBgFilters();
  saveState();
});

// Theme
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.theme = btn.dataset.theme;
    document.documentElement.dataset.theme = state.theme;
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b === btn));
    updateBgFilters();
    drawWheel();
    saveState();
  });
});

// Sound
document.getElementById('soundToggle').addEventListener('click', (e) => {
  state.sound = !state.sound;
  e.currentTarget.classList.toggle('on', state.sound);
  saveState();
});

// Fullscreen
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});

// Save
document.getElementById('saveBtn').addEventListener('click', saveCurrentSpinner);

// Spin
document.getElementById('centerBtn').addEventListener('click', spin);
canvas.addEventListener('click', spin);

// Result dismiss
document.getElementById('resultDismiss').addEventListener('click', hideResult);
document.getElementById('resultOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) hideResult();
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !state.spinning) { e.preventDefault(); spin(); }
  if (e.code === 'Escape') { hideResult(); closeAdmin(); }
});

// Resize
function handleResize() { drawWheel(); }
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => setTimeout(handleResize, 100));

// ── ACCENT COLOR ──
function updateAccentColor() {
  const accent = state.colors[0] || '#FF4444';
  document.documentElement.style.setProperty('--accent', accent);
}

// ── PERSISTENCE ──
function saveState() {
  try {
    const data = {
      title: state.title,
      options: state.options,
      colors: state.colors,
      rigged: state.rigged,
      riggedIndex: state.riggedIndex,
      theme: state.theme,
      sound: state.sound,
      bgImage: state.bgImage,
      bgBlur: state.bgBlur,
      bgFade: state.bgFade,
    };
    localStorage.setItem('spinner-state', JSON.stringify(data));
  } catch(e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem('spinner-state');
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(state, data);
    }
  } catch(e) {}
}

// ── APPLY FULL STATE ──
function applyFullState() {
  document.documentElement.dataset.theme = state.theme;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === state.theme));
  document.getElementById('riggedToggle').classList.toggle('on', state.rigged);
  document.getElementById('riggedSelect').classList.toggle('visible', state.rigged);
  document.getElementById('soundToggle').classList.toggle('on', state.sound);
  document.getElementById('titleInput').value = state.title;
  document.getElementById('bgBlurSlider').value = state.bgBlur;
  document.getElementById('bgBlurVal').textContent = state.bgBlur;
  document.getElementById('bgFadeSlider').value = state.bgFade;
  document.getElementById('bgFadeVal').textContent = state.bgFade;
  updateAccentColor();
  updateTitle();
  updateBgImage();
  renderOptions();
  renderColors();
  renderSavedList();
  drawWheel();
}

// ── INIT ──
function init() {
  loadState();
  applyFullState();
}

init();
</script>
